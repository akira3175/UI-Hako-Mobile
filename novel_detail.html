<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Nhân Vật Chính Trong Truyện Lãng Mạn Kỳ Ảo Chỉ Thích Mình Tôi - Đọc truyện trên Hako">
  <title>Nhân Vật Chính Trong Truyện Lãng Mạn Kỳ Ảo Chỉ Thích Mình Tôi - Hako</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ====== Design Tokens (same as main app) ====== */
    :root {
      --bg-primary: #f4f8ff;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --bg-elevated: #edf3fc;
      --bg-navbar: rgba(255, 255, 255, 0.85);
      --bg-tint: #e8f0fe;

      --text-primary: #1a2033;
      --text-secondary: #5f6b82;
      --text-tertiary: #9aa5b8;

      --accent-primary: #3b82f6;
      --accent-secondary: #60a5fa;
      --accent-light: #dbeafe;
      --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #60a5fa 100%);
      --accent-glow: rgba(59, 130, 246, 0.2);

      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;

      --border-light: rgba(59, 130, 246, 0.1);
      --border-medium: rgba(59, 130, 246, 0.15);

      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --radius-xl: 22px;
      --radius-full: 100px;

      --shadow-sm: 0 1px 3px rgba(59, 130, 246, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-card: 0 2px 12px rgba(59, 130, 246, 0.08), 0 1px 3px rgba(0, 0, 0, 0.04);
      --shadow-elevated: 0 8px 30px rgba(59, 130, 246, 0.1), 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-glow: 0 4px 14px rgba(59, 130, 246, 0.25);

      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

      --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-smooth: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-spring: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* ====== Reset ====== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html {
      font-size: 16px;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      overflow: hidden;
      height: 100%;
    }
    body {
      font-family: var(--font-family);
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }
    button { border: none; background: none; cursor: pointer; font-family: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
    a { text-decoration: none; color: inherit; }
    img { display: block; max-width: 100%; }

    /* ====== App Frame ====== */
    #app {
      max-width: 430px;
      margin: 0 auto;
      height: 100vh;
      height: 100dvh;
      position: relative;
      overflow: hidden;
      background: var(--bg-primary);
    }

    /* ====== Top Navigation Bar ====== */
    .detail-topbar {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 200;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .detail-topbar.scrolled {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px) saturate(1.8);
      -webkit-backdrop-filter: blur(20px) saturate(1.8);
      box-shadow: 0 1px 12px rgba(0,0,0,0.06);
    }

    .detail-topbar.scrolled .topbar-title {
      opacity: 1;
      transform: translateY(0);
    }

    .topbar-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(10px);
      color: white;
      transition: all var(--transition-fast);
    }

    .detail-topbar.scrolled .topbar-btn {
      background: var(--bg-elevated);
      color: var(--text-primary);
    }

    .topbar-btn:active {
      transform: scale(0.9);
    }

    .topbar-btn svg {
      width: 20px;
      height: 20px;
    }

    .topbar-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-primary);
      max-width: 220px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.3s ease;
    }

    .topbar-right {
      display: flex;
      gap: 8px;
    }

    /* ====== Scroll Container ====== */
    .detail-scroll {
      height: 100vh;
      height: 100dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }
    .detail-scroll::-webkit-scrollbar { display: none; }

    /* ====== Hero Section ====== */
    .detail-hero {
      position: relative;
      height: 250px;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center top;
      filter: blur(18px) brightness(0.5) saturate(1.5);
      transform: scale(1.15);
    }

    .hero-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.15) 0%,
        rgba(0,0,0,0.65) 100%
      );
    }

    .hero-content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      gap: 16px;
      padding: 0 20px 36px;
      z-index: 2;
    }

    .hero-cover {
      width: 120px;
      height: 170px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35), 0 2px 8px rgba(0,0,0,0.2);
      border: 2px solid rgba(255,255,255,0.15);
      position: relative;
    }

    .hero-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }



    .hero-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .hero-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: white;
      line-height: 1.3;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .hero-author {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.75);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hero-author svg {
      width: 14px;
      height: 14px;
      opacity: 0.7;
    }

    .hero-stats {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 500;
    }

    .hero-stats-separator {
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.7rem;
    }

    .action-btn-primary {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
      border-radius: var(--radius-lg);
      background: var(--accent-gradient);
      color: white;
      font-size: 0.9rem;
      font-weight: 700;
      box-shadow: var(--shadow-glow);
      transition: all var(--transition-fast);
    }

    .action-btn-primary:active {
      transform: scale(0.97);
      box-shadow: none;
    }

    .action-btn-primary svg {
      width: 20px;
      height: 20px;
    }

    .action-btn-secondary {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-card);
      transition: all var(--transition-fast);
      color: var(--text-secondary);
    }

    .action-btn-secondary:active {
      transform: scale(0.92);
      background: var(--bg-elevated);
    }

    .action-btn-secondary.bookmarked {
      color: var(--accent-primary);
      background: var(--accent-light);
      border-color: rgba(59, 130, 246, 0.25);
    }

    .action-btn-secondary svg {
      width: 22px;
      height: 22px;
    }

    /* ====== Info Cards ====== */
    .info-section {
      position: relative;
      z-index: 10;
      background: var(--bg-primary);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 24px 20px 0;
      margin-top: -24px;
    }

    .stats-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: transparent;
      border: none;
      border-radius: var(--radius-md);
      padding: 12px 8px;
      text-align: center;
      box-shadow: none;
    }

    .stat-card.btn-like {
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform var(--transition-fast), background var(--transition-fast);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .stat-card.btn-like:active {
      transform: scale(0.95);
      background: rgba(59, 130, 246, 0.08);
    }

    .like-value {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .like-icon {
      width: 14px;
      height: 14px;
      color: #ef4444;
      fill: none;
      transition: fill 0.3s ease, transform 0.2s ease;
    }

    .stat-card.btn-like.liked .like-icon {
      fill: #ef4444;
    }

    .stat-card-value {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 2px;
    }

    .stat-card-value.rating {
      color: #f59e0b;
    }

    .stat-card-label {
      font-size: 0.65rem;
      color: var(--text-tertiary);
      font-weight: 500;
    }

    /* ====== Genre Tags ====== */
    .genre-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .genre-tag {
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--accent-light);
      color: var(--accent-primary);
      border: 1px solid rgba(59, 130, 246, 0.15);
      transition: all var(--transition-fast);
    }

    .genre-tag:active {
      transform: scale(0.95);
    }

    /* ====== Alternative Name ====== */
    .another-name-section {
      margin-bottom: 16px;
      font-size: 0.8rem;
      color: var(--text-secondary);
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .another-name-label {
      color: var(--text-tertiary);
      font-weight: 500;
    }

    .another-name-value {
      font-weight: 600;
      color: var(--text-primary);
    }

    /* ====== Description ====== */
    .description-section {
      margin-bottom: 20px;
    }

    .description-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 10px;
    }

    .description-text {
      font-size: 0.82rem;
      line-height: 1.7;
      color: var(--text-secondary);
      white-space: pre-line;
    }

    /* ====== Chapter Section ====== */
    .chapter-section {
      padding: 0 20px 24px;
    }

    /* ====== Review Section ====== */
    .review-section {
      margin-bottom: 20px;
    }

    /* ====== Contributors Section ====== */
    .contributors-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .contributor-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
    }

    .contributor-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .contributor-avatar.team-avatar {
      background: var(--accent-light);
      color: var(--accent-primary);
    }

    .contributor-avatar.team-avatar svg {
      width: 16px;
      height: 16px;
    }

    .contributor-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .contributor-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .contributor-label {
      font-size: 0.62rem;
      color: var(--text-tertiary);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      line-height: 1.2;
    }

    .contributor-name {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .review-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .review-section-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .review-count {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-tertiary);
    }

    .review-see-all {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--accent-primary);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 0;
    }

    .review-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .review-item {
      padding: 14px;
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
    }

    .review-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .review-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      background: var(--bg-elevated);
    }

    .review-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .review-user-info {
      flex: 1;
      min-width: 0;
    }

    .review-username {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .review-time {
      font-size: 0.65rem;
      color: var(--text-tertiary);
      font-weight: 500;
    }

    .review-stars {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
    }

    .review-stars svg {
      width: 14px;
      height: 14px;
    }

    .review-stars .star-filled {
      fill: #f59e0b;
      stroke: #f59e0b;
    }

    .review-stars .star-empty {
      fill: none;
      stroke: var(--text-tertiary);
    }

    .review-content {
      font-size: 0.8rem;
      line-height: 1.6;
      color: var(--text-secondary);
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .review-footer {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .review-like-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: var(--text-tertiary);
      font-size: 0.7rem;
      font-weight: 500;
      cursor: pointer;
      padding: 0;
    }

    .review-like-btn svg {
      width: 14px;
      height: 14px;
    }

    /* ====== Comment Section ====== */
    .comment-section {
      padding: 0 20px 120px;
    }

    .comment-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .comment-section-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .comment-count {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-tertiary);
    }

    .comment-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .comment-item {
      display: flex;
      gap: 12px;
      padding: 14px;
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
      transition: all var(--transition-fast);
    }

    .comment-item:active {
      transform: scale(0.99);
    }

    .comment-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      border: 2px solid var(--accent-light);
    }

    .comment-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .comment-body {
      flex: 1;
      min-width: 0;
    }

    .comment-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .comment-username {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .comment-time {
      font-size: 0.68rem;
      color: var(--text-tertiary);
      font-weight: 500;
      flex-shrink: 0;
    }

    .comment-chap-tag {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--text-tertiary);
      margin-bottom: 6px;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .comment-content {
      font-size: 0.8rem;
      line-height: 1.6;
      color: var(--text-secondary);
    }

    .comment-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }

    .comment-like-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-tertiary);
      padding: 4px 8px;
      border-radius: var(--radius-full);
      transition: all var(--transition-fast);
    }

    .comment-like-btn:active {
      transform: scale(0.9);
    }

    .comment-like-btn svg {
      width: 14px;
      height: 14px;
    }

    /* Pagination */
    .comment-pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 20px;
    }

    .page-btn {
      min-width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      transition: all var(--transition-fast);
    }

    .page-btn:active {
      transform: scale(0.92);
    }

    .page-btn.active {
      background: var(--accent-gradient);
      color: white;
      border-color: transparent;
      box-shadow: var(--shadow-glow);
    }

    .page-btn.disabled {
      opacity: 0.35;
      pointer-events: none;
    }

    .page-btn svg {
      width: 16px;
      height: 16px;
    }

    .chapter-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .chapter-section-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .chapter-count {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-tertiary);
      background: var(--bg-elevated);
      padding: 4px 12px;
      border-radius: var(--radius-full);
    }

    .chapter-sort-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent-primary);
      padding: 6px 12px;
      border-radius: var(--radius-full);
      background: var(--accent-light);
      border: 1px solid rgba(59, 130, 246, 0.15);
      transition: all var(--transition-fast);
    }

    .chapter-sort-btn:active {
      transform: scale(0.95);
    }

    .chapter-sort-btn svg {
      width: 14px;
      height: 14px;
    }

    /* Volume Accordion */
    .volume-group {
      margin-bottom: 12px;
    }

    .volume-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--transition-fast);
      box-shadow: var(--shadow-sm);
    }

    .volume-header:active {
      transform: scale(0.99);
    }

    .volume-header.open {
      border-radius: var(--radius-md) var(--radius-md) 0 0;
      border-bottom-color: transparent;
      background: var(--accent-light);
    }

    .volume-cover {
      width: 40px;
      height: 56px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: var(--bg-secondary);
    }

    .volume-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .volume-info {
      flex: 1;
      min-width: 0;
    }

    .volume-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .volume-count {
      font-size: 0.7rem;
      color: var(--text-tertiary);
      font-weight: 500;
      margin-top: 2px;
    }

    .volume-chevron {
      width: 20px;
      height: 20px;
      color: var(--text-tertiary);
      transition: transform 0.3s ease;
      flex-shrink: 0;
    }

    .volume-header.open .volume-chevron {
      transform: rotate(180deg);
      color: var(--accent-primary);
    }

    .volume-chapters {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      border-top: none;
      border-radius: 0 0 var(--radius-md) var(--radius-md);
    }

    .volume-chapters.open {
      max-height: 5000px;
    }

    .chapter-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-light);
      cursor: pointer;
      transition: background var(--transition-fast);
    }

    .chapter-item:last-child {
      border-bottom: none;
    }

    .chapter-item:active {
      background: var(--bg-elevated);
    }



    .chapter-info {
      flex: 1;
      min-width: 0;
    }

    .chapter-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chapter-date {
      font-size: 0.65rem;
      color: var(--text-tertiary);
      margin-top: 2px;
    }

    .chapter-arrow {
      width: 16px;
      height: 16px;
      color: var(--text-tertiary);
      flex-shrink: 0;
    }

    /* ====== Floating Read Button ====== */
    .floating-read-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      padding: 12px 20px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      z-index: 150;
      background: linear-gradient(transparent, var(--bg-primary) 30%);
    }

    .floating-read-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 24px;
      border-radius: var(--radius-xl);
      background: var(--accent-gradient);
      color: white;
      font-size: 0.95rem;
      font-weight: 700;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4), 0 2px 8px rgba(59, 130, 246, 0.2);
      transition: all var(--transition-fast);
      letter-spacing: 0.3px;
    }

    .floating-read-btn:active {
      transform: scale(0.97);
      box-shadow: 0 2px 10px rgba(59, 130, 246, 0.3);
    }

    .floating-read-btn svg {
      width: 22px;
      height: 22px;
    }

    .floating-read-subtitle {
      font-size: 0.65rem;
      font-weight: 500;
      opacity: 0.85;
    }

    .floating-read-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    /* ====== Star Rating ====== */
    .star-rating {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .star-rating .star {
      width: 14px;
      height: 14px;
      color: #f59e0b;
    }

    .star-rating .star.empty {
      color: #d1d5db;
    }

    .star-rating .rating-value {
      font-size: 0.8rem;
      font-weight: 700;
      color: #f59e0b;
      margin-left: 4px;
    }

    /* ====== Animations ====== */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-in {
      animation: fadeInUp 0.4s ease-out both;
    }

    .animate-in-delay-1 { animation-delay: 0.05s; }
    .animate-in-delay-2 { animation-delay: 0.1s; }
    .animate-in-delay-3 { animation-delay: 0.15s; }
    .animate-in-delay-4 { animation-delay: 0.2s; }
    .animate-in-delay-5 { animation-delay: 0.25s; }
  </style>
</head>

  <script src="novel_volume_chapter.js"></script>
  <script src="novel_review.js"></script>
  <script src="comment-novel.js"></script>
  <script>
    /* =============================================
       NOVEL DETAIL PAGE – Logic
       ============================================= */

    // Novel data
    const novelData = {
      id: "td-1",
      title: "Nhân Vật Chính Trong Truyện Lãng Mạn Kỳ Ảo Chỉ Thích Mình Tôi",
      cover: "https://images.novelpia.com/imagebox/f1/f13d921146eed006f0f507238642d199_3455872_1751592719_ori.file",
      author: "Verbena",
      artist: "Chưa cập nhật",
      anotherName: "로판 속 주인공이 나만 좋아함",
      description: "Quý cô sa cơ Marigold, cho đến khi em hạnh phúc.",
      translatorGroup: "Aiko",
      uploader: "Aiko Shimizu",
      genres: ["Pure Love", "Romance", "Fantasy"],
      lastUpdated: "1 ngày",
      wordCount: "3.5 tr số từ",
      rating: 4.9,
      views: "5 triệu lượt xem",
      likes: "24.5K",
      chapter: "175. Hạnh Phúc Chắc Chắn Sẽ Đến",
      type: "truyendich",
      badge: "hot",
      status: "completed"
    };

    // Chapter data comes from novel_volume_chapter.js (loaded via script tag)
    let volumeData = [];

    document.addEventListener('DOMContentLoaded', () => {
      renderNovelInfo();
      loadChapterData();
      initScrollEffects();
      initInteractions();
      initReviews();
      initComments();
    });

    /* --- Render Novel Info --- */
    function renderNovelInfo() {
      // Hero
      document.getElementById('hero-bg').style.backgroundImage = `url('${novelData.cover}')`;
      document.getElementById('cover-img').src = novelData.cover;
      document.getElementById('cover-img').alt = novelData.title;
      document.getElementById('hero-title').textContent = novelData.title;
      document.getElementById('author-name').textContent = novelData.author;
      
      // Hero stats
      document.getElementById('stat-words').textContent = novelData.wordCount;
      document.getElementById('sc-updated').textContent = novelData.lastUpdated;
      
      const typeTag = document.getElementById('hero-type');
      if (novelData.type === 'truyendich') {
        typeTag.textContent = 'Truyện dịch';
      } else if (novelData.type === 'sangtac') {
        typeTag.textContent = 'Truyện sáng tác';
      } else if (novelData.type === 'aidich') {
        typeTag.textContent = 'AI dịch';
      } else {
        typeTag.textContent = 'Truyện dịch';
      }

      const statusTag = document.getElementById('hero-status');
      if (novelData.status === 'completed') {
        statusTag.textContent = 'Đã hoàn thành';
      } else {
        statusTag.textContent = 'Đang tiến hành';
      }


      // Stat cards
      document.getElementById('sc-rating').textContent = `⭐ ${novelData.rating}`;
      document.getElementById('sc-views').textContent = novelData.views.replace(' lượt xem', '');
      document.getElementById('sc-likes-count').textContent = novelData.likes;

      // Genre tags
      const genreContainer = document.getElementById('genre-tags');
      genreContainer.innerHTML = novelData.genres.map(g =>
        `<button class="genre-tag">${g}</button>`
      ).join('');

      // Description
      document.getElementById('description-text').textContent = novelData.description;

      // Alternative Name (show above genres)
      const anotherNameSec = document.getElementById('another-name-section');
      const anotherNameText = document.getElementById('another-name-text');
      if (novelData.anotherName && novelData.anotherName.trim() !== '' && novelData.anotherName !== 'Chưa cập nhật') {
        anotherNameText.textContent = novelData.anotherName;
        anotherNameSec.style.display = 'flex';
      } else {
        anotherNameSec.style.display = 'none';
      }


      // Contributors Cards
      document.getElementById('contrib-translator').textContent = novelData.translatorGroup;
      document.getElementById('contrib-uploader').textContent = novelData.uploader;
      
      const contribUploaderImg = document.getElementById('contrib-uploader-img');
      if (novelData.uploader === "Aiko Shimizu") {
        contribUploaderImg.src = "https://i.pravatar.cc/150?img=1";
      } else {
        contribUploaderImg.src = "https://i.pravatar.cc/150?img=15";
      }
      contribUploaderImg.alt = novelData.uploader;


      // Floating button
      document.getElementById('floating-chapter-name').textContent = novelData.chapter;
    }

    /* --- Load Chapter Data --- */
    function loadChapterData() {
      // novelVolumeChapters is defined in novel_volume_chapter.js (loaded via <script> tag above)
      if (typeof novelVolumeChapters !== 'undefined' && Array.isArray(novelVolumeChapters)) {
        volumeData = novelVolumeChapters;
        renderVolumes(volumeData);
      } else {
        console.error('Chapter data not found. Make sure novel_volume_chapter.js is loaded.');
      }
    }

    // Get cover image for volume
    function getVolumeCover(volumeTitle) {
      const covers = {
        "Minh Họa": "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRALphL4kbUuaBNDJRSXbnaIGiIwLchXnxy0w&s",
        "Tập 1": "https://images.novelpia.com/imagebox/f1/f13d921146eed006f0f507238642d199_3455872_1751592719_ori.file",
        "Tập 2": "https://p.sda1.dev/27/09b0dac6a102fbe6118459310ac1f146/NeatReader-1760116094040.png",
        "Tập 3": "https://valvrareteam.b-cdn.net/illustrations/1772188398685-a6cd06e8ae521f859e5ff28a5053e896-1226272-1752931882-ori.png",
        "Tập 4": "https://valvrareteam.b-cdn.net/illustrations/1772907718445-4a6de4861f6fec849d2b61b8e62dc2b4-1952088-1760541609-ori.png"
      };
      return covers[volumeTitle] || "https://images.novelpia.com/imagebox/f1/f13d921146eed006f0f507238642d199_3455872_1751592719_ori.file";
    }

    // Get chapter release date
    function getChapterDate(ch, ci, vi) {
      if (ch.text_content) {
        const match = ch.text_content.match(/^Ngày\s+(\d+)\s+tháng\s+(\d+)\s+năm\s+(\d+)/);
        if (match) {
          const day = match[1].padStart(2, '0');
          const month = match[2].padStart(2, '0');
          const year = match[3];
          return `${day}/${month}/${year}`;
        }
      }
      
      // Calculate chronological date offset
      let absoluteIndex = ci;
      if (vi > 0 && typeof volumeData !== 'undefined') {
        for (let i = 0; i < vi; i++) {
          absoluteIndex += volumeData[i].chapters ? volumeData[i].chapters.length : 0;
        }
      }
      
      const baseTime = 1713139200000; // April 15, 2024
      const increment = 3.5 * 24 * 60 * 60 * 1000; // 3.5 days per chapter
      const chapterTime = new Date(baseTime + absoluteIndex * increment);
      
      const day = String(chapterTime.getDate()).padStart(2, '0');
      const month = String(chapterTime.getMonth() + 1).padStart(2, '0');
      const year = chapterTime.getFullYear();
      return `${day}/${month}/${year}`;
    }

    /* --- Render Volumes & Chapters --- */
    function renderVolumes(volumes) {
      const container = document.getElementById('volume-list');

      // Count total chapters
      let totalChapters = 0;
      volumes.forEach(vol => {
        totalChapters += vol.chapters ? vol.chapters.length : 0;
      });

      container.innerHTML = volumes.map((vol, vi) => {
        const chapCount = vol.chapters ? vol.chapters.length : 0;
        const isFirst = vi === 0;

        const chaptersHTML = (vol.chapters || []).map((ch, ci) => `
          <div class="chapter-item" data-vol="${vi}" data-ch="${ci}" onclick="window.location.href='chapter_detail.html?vol=${vi}&ch=${ci}'">
            <div class="chapter-info">
              <div class="chapter-title">${ch.title}</div>
              <div class="chapter-date">${getChapterDate(ch, ci, vi)}</div>
            </div>
            <svg class="chapter-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </div>
        `).join('');

        return `
          <div class="volume-group">
            <div class="volume-header${isFirst ? ' open' : ''}" data-volume="${vi}">
              <div class="volume-cover">
                <img src="${getVolumeCover(vol.volume_title)}" alt="${vol.volume_title}">
              </div>
              <div class="volume-info">
                <div class="volume-title">${vol.volume_title}</div>
              </div>
              <svg class="volume-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
            <div class="volume-chapters${isFirst ? ' open' : ''}" id="vol-chapters-${vi}">
              ${chaptersHTML}
            </div>
          </div>
        `;
      }).join('');

      // Add click listeners for accordions
      container.querySelectorAll('.volume-header').forEach(header => {
        header.addEventListener('click', () => {
          const vi = header.dataset.volume;
          const chapters = document.getElementById(`vol-chapters-${vi}`);
          const isOpen = header.classList.contains('open');

          if (isOpen) {
            header.classList.remove('open');
            chapters.classList.remove('open');
          } else {
            header.classList.add('open');
            chapters.classList.add('open');
          }
        });
      });
    }

    /* --- Scroll Effects --- */
    function initScrollEffects() {
      const scrollContainer = document.getElementById('detail-scroll');
      const topbar = document.getElementById('detail-topbar');

      scrollContainer.addEventListener('scroll', () => {
        const scrollY = scrollContainer.scrollTop;

        if (scrollY > 200) {
          topbar.classList.add('scrolled');
        } else {
          topbar.classList.remove('scrolled');
        }
      }, { passive: true });
    }

    /* --- Interactions --- */
    function initInteractions() {
      // Like button toggle
      const likeBtn = document.getElementById('sc-btn-like');
      if (likeBtn) {
        let isLiked = false;
        let baseLikes = 24.5;
        
        likeBtn.addEventListener('click', () => {
          isLiked = !isLiked;
          likeBtn.classList.toggle('liked', isLiked);
          
          const likesCountEl = document.getElementById('sc-likes-count');
          if (isLiked) {
            likesCountEl.textContent = (baseLikes + 0.1).toFixed(1) + 'K';
          } else {
            likesCountEl.textContent = baseLikes.toFixed(1) + 'K';
          }
          
          // snappier active scaling bounce animation
          likeBtn.style.transform = 'scale(0.88)';
          setTimeout(() => {
            likeBtn.style.transform = 'scale(1.06)';
            setTimeout(() => {
              likeBtn.style.transform = 'scale(1)';
            }, 100);
          }, 80);
        });
      }

      // Sort toggle
      const sortBtn = document.getElementById('btn-sort-chapters');
      if (sortBtn) {
        let sortAsc = false;
        sortBtn.addEventListener('click', () => {
          sortAsc = !sortAsc;
          sortBtn.innerHTML = `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="14" y2="12"/><line x1="4" y1="18" x2="8" y2="18"/></svg>
            ${sortAsc ? 'Cũ nhất' : 'Mới nhất'}
          `;
          if (volumeData.length > 0) {
            const reversed = volumeData.map(vol => ({
              ...vol,
              chapters: [...(vol.chapters || [])].reverse()
            }));
            if (sortAsc) {
              renderVolumes(reversed);
            } else {
              renderVolumes(volumeData);
            }
          }
        });
      }
    }

    /* --- Review Section --- */
    function initReviews() {
      if (typeof novelReviews === 'undefined' || !Array.isArray(novelReviews)) {
        console.error('Review data not found.');
        return;
      }
      document.getElementById('review-total').textContent = `(${novelReviews.length})`;
      const latest = novelReviews.slice(0, 2);
      const listEl = document.getElementById('review-list');
      listEl.innerHTML = latest.map(r => {
        const stars = Array.from({ length: 5 }, (_, i) => {
          const cls = i < r.rate ? 'star-filled' : 'star-empty';
          return `<svg class="${cls}" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`;
        }).join('');
        return `
          <div class="review-item">
            <div class="review-header">
              <div class="review-avatar"><img src="${r.avatar}" alt="${r.username}"></div>
              <div class="review-user-info">
                <div class="review-username">${r.username}</div>
                <div class="review-time">${r.time}</div>
              </div>
              <div class="review-stars">${stars}</div>
            </div>
            <div class="review-content">${r.content}</div>
            <div class="review-footer">
              <button class="review-like-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>
                ${r.likes}
              </button>
            </div>
          </div>`;
      }).join('');
    }

    /* --- Comment Section --- */
    const COMMENTS_PER_PAGE = 5;
    let currentCommentPage = 1;

    function initComments() {
      if (typeof novelComments === 'undefined' || !Array.isArray(novelComments)) {
        console.error('Comment data not found.');
        return;
      }
      document.getElementById('comment-total').textContent = `(${novelComments.length})`;
      renderComments(1);
    }

    function renderComments(page) {
      currentCommentPage = page;
      const start = (page - 1) * COMMENTS_PER_PAGE;
      const end = start + COMMENTS_PER_PAGE;
      const pageComments = novelComments.slice(start, end);

      const listEl = document.getElementById('comment-list');
      listEl.innerHTML = pageComments.map(c => {
        const chapTag = c.chapTitle
          ? `<div class="comment-chap-tag">${c.chapTitle}</div>`
          : '';
        return `
          <div class="comment-item">
            <div class="comment-avatar">
              <img src="${c.avatar}" alt="${c.username}" loading="lazy">
            </div>
            <div class="comment-body">
              <div class="comment-header">
                <span class="comment-username">${c.username}</span>
                <span class="comment-time">${c.time}</span>
              </div>
              ${chapTag}
              <div class="comment-content">${c.content}</div>
              <div class="comment-actions">
                <button class="comment-like-btn">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                  ${c.likes}
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      renderCommentPagination();

      // Scroll comment section into view smoothly
      const commentSection = document.querySelector('.comment-section');
      if (page > 1 && commentSection) {
        commentSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function renderCommentPagination() {
      const totalPages = Math.ceil(novelComments.length / COMMENTS_PER_PAGE);
      const pagEl = document.getElementById('comment-pagination');
      if (totalPages <= 1) {
        pagEl.innerHTML = '';
        return;
      }

      let html = '';

      // Previous button
      html += `<button class="page-btn${currentCommentPage === 1 ? ' disabled' : ''}" onclick="renderComments(${currentCommentPage - 1})">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>`;

      // Page numbers
      for (let i = 1; i <= totalPages; i++) {
        if (totalPages > 5 && Math.abs(i - currentCommentPage) > 1 && i !== 1 && i !== totalPages) {
          if (i === currentCommentPage - 2 || i === currentCommentPage + 2) {
            html += `<span style="color: var(--text-tertiary); font-size: 0.8rem; padding: 0 2px;">…</span>`;
          }
          continue;
        }
        html += `<button class="page-btn${i === currentCommentPage ? ' active' : ''}" onclick="renderComments(${i})">${i}</button>`;
      }

      // Next button
      html += `<button class="page-btn${currentCommentPage === totalPages ? ' disabled' : ''}" onclick="renderComments(${currentCommentPage + 1})">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>`;

      pagEl.innerHTML = html;
    }

    /* --- Navigate to Last Read Chapter --- */
    function navigateToLastRead() {
      // Navigate to the last chapter in the data (simulating "continue reading")
      if (volumeData.length > 0) {
        const lastVol = volumeData.length - 1;
        const lastCh = (volumeData[lastVol].chapters || []).length - 1;
        window.location.href = `chapter_detail.html?vol=${lastVol}&ch=${Math.max(0, lastCh)}`;
      } else {
        window.location.href = 'chapter_detail.html?vol=0&ch=0';
      }
    }
  </script>
</body>
</html>
